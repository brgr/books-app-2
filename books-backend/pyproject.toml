[project]
name = "books-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.0",
    "sqlalchemy>=2.0.51",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "PyJWT>=2.13.0",
    "Pillow>=12.3.0",
    "imagehash>=4.3.2",
]

[dependency-groups]
dev = [
    "ty>=0.0.56",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1", # Required by TestClient
    "ruff>=0.15.20",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["external: tests that hit external services (deselect with '-m \"not external\"')"]
