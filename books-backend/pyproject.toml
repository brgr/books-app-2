[project]
name = "books-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.52",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "PyJWT>=2.13.0",
    "Pillow>=12.3.0",
    "imagehash>=4.3.2",
]

[dependency-groups]
dev = [
    "ty>=0.0.80",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1", # Required by TestClient
    "ruff>=0.16.6",
    "pytest-xdist>=3.8.0",
]

[tool.ruff.lint]
# Expand coverage gradually to keep each cleanup manageable
select = [
    "E4", "E7", "E9", "F", "I", "B", "SIM", "C4", "PIE", "RUF",
    "PT", "RET", "A", "ASYNC", "PLE", "PLW", "PGH", "T10", "LOG", "G", "PERF",
    "UP", "FAST"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["external: tests that hit external services (deselect with '-m \"not external\"')"]
